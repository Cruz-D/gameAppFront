<div class="container my-5">
  <h2 class="text-center mb-4">Mis Órdenes</h2>

  <div *ngIf="loading" class="text-center my-5">
    <div class="spinner-border text-success" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
    <div>Cargando tus órdenes...</div>
  </div>

  <div *ngIf="!loading && orders.length === 0" class="alert alert-info text-center">
    No tienes órdenes registradas.
  </div>

  <div *ngIf="!loading && orders.length > 0">
    <div class="table-responsive">
      <table class="table table-dark table-striped table-bordered align-middle">
        <thead>
          <tr>
            <th>ID de Orden</th>
            <th>Estado</th>
            <th>Fecha de Orden</th>
            <th>Fecha de Recepción</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let order of orders">
            <td>{{ order.orderId }}</td>
            <td>
              <span [ngClass]="{
                'badge bg-warning text-dark': order.stateOfOrder === 'Pending',
                'badge bg-success': order.stateOfOrder === 'Completed',
                'badge bg-danger': order.stateOfOrder === 'Cancelled'
              }">
                {{ order.stateOfOrder }}
              </span>
            </td>
            <td>{{ order.orderDate | date:'medium' }}</td>
            <td>{{ order.receivedDate | date:'medium' }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
