<div class="container-fluid my-5">
  <div class="row">
    <div class="col-12">
      <div class="bg-dark bg-opacity-75 rounded-4 shadow-lg p-0">
        <div class="px-4 py-3 border-bottom border-success bg-success bg-opacity-75 text-white font-pixel rounded-top-4">
          <h2 class="mb-0">🛒 Tu carrito</h2>
        </div>
        <div class="p-4">
          <div *ngIf="cartService.items.length; else emptyCart">
            <div class="table-responsive">
              <table class="table align-middle table-hover mb-0">
                <thead class="table-success">
                  <tr>
                    <th></th>
                    <th class="font-vrcosd">Producto</th>
                    <th class="font-vrcosd text-end">Precio</th>
                    <th class="font-vrcosd text-center">Cantidad</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let item of cartService.items">
                    <td style="width: 60px;">
                      <img [src]="item.image" alt="{{item.name}}" class="img-thumbnail rounded" style="max-width: 48px;">
                    </td>
                    <td class="font-vrcosd">{{item.name}}</td>
                    <td class="font-vrcosd text-end">{{item.price | currency:'EUR':'symbol' }}</td>
                    <td class="font-vrcosd text-center">x {{item.quantity}}</td>
                    <td>
                      <button class="btn btn-outline-danger btn-sm" (click)="cartService.removeFromCart(item.productId)">
                        <i class="fa fa-trash"></i> Eliminar
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-3 mt-4">
              <div class="font-vrcosd fs-5">
                <span class="text-muted">Total:</span>
                <span class="fw-bold text-success">{{cartService.totalPrice | currency:'EUR':'symbol' }}</span>
              </div>
              <a class="btn btn-success font-vrcosd px-4 py-2 shadow" [routerLink]="['/checkout']">
                <i class="fa fa-credit-card me-2"></i>Finalizar compra
              </a>
            </div>
          </div>
          <ng-template #emptyCart>
            <div class="text-center text-muted py-5">
              <i class="fa fa-shopping-cart fa-3x mb-3"></i>
              <div class="font-vrcosd fs-4">El carrito está vacío.</div>
            </div>
          </ng-template>
        </div>
      </div>
    </div>
  </div>
</div>
