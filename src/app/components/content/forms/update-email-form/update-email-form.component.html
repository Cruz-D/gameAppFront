<form [formGroup]="emailForm" (ngSubmit)="onSubmit()" class="p-3">
  <div class="mb-3">
    <label class="form-label font-vrcosd">Correo actual</label>
    <div class="form-control-plaintext font-vrcosd">{{ oldEmail }}</div>
  </div>
  <div class="mb-3">
    <label class="form-label font-vrcosd">Nuevo correo electrónico</label>
    <input
      type="email"
      class="form-control"
      formControlName="newEmail"
      [ngClass]="{'is-invalid': emailForm.get('newEmail')?.invalid && emailForm.get('newEmail')?.touched}"
      required
    />
    <div class="invalid-feedback" *ngIf="emailForm.get('newEmail')?.invalid && emailForm.get('newEmail')?.touched">
      Introduce un correo electrónico válido.
    </div>
  </div>
  <div class="text-end">
    <button type="button" class="btn btn-secondary font-vrcosd me-2" (click)="onCancel()">Cancelar</button>
    <button type="submit" class="btn btn-success font-vrcosd" [disabled]="emailForm.invalid">Guardar</button>
  </div>
</form>
