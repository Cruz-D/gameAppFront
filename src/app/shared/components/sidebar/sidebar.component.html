<aside class="sidebar custom-sidebar py-4" [class.open]="isOpen">
  <button class="close-btn" (click)="close()">
    <i class="fas fa-times"></i>
  </button>
  <div class="sidebar-header text-center mb-4">
    <i class="fas fa-user-circle fa-3x"></i>
    <h2 class="username mt-2">{{ username }}</h2>
    <hr>
  </div>
  <nav>
    <ul class="sidebar-links">
      <li><a [routerLink]="['/profile', userId]"><i class="fas fa-user"></i> Perfil</a></li>
      <li><a routerLink="/my-orders"><i class="fas fa-box"></i> Mis pedidos</a></li>
      <li><a (click)="logout()"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a></li>
    </ul>
  </nav>
</aside>
